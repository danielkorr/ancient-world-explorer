# Keeps the free-tier Supabase project from auto-pausing for inactivity.
# Makes one cheap read against the public REST API (profiles is publicly
# readable under RLS), using the same public URL/key the site already ships
# in js/config.js. No secrets needed.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 9 */2 * *'   # every 2 days, 09:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query Supabase
        run: |
          # config.js holds local/staging/production blocks; use production.
          URL=https://nqubatkwmosbsadmaugo.supabase.co
          KEY=$(grep -A1 "nqubatkwmosbsadmaugo" js/config.js | sed -n "s/.*SUPABASE_KEY: *'\([^']*\)'.*/\1/p")
          test -n "$KEY"
          curl -fsS "$URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
