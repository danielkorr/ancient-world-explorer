name: AWE WebKit touch test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  webkit-touch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run test:webkit